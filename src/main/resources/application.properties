spring.application.name=HeartdiseaseApp
spring.datasource.url=jdbc:mysql://localhost:3306/smartcardio?createDatabaseIfNotExist=false&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update 
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
server.port=9000
##pour la securité on va utiliser le jwt token et on va configurer le resource server pour qu'il puisse valider les tokens émis par keycloak
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/SecurityforSmartcardio
##keycloak cherche le public key pour valider le token dans l'endpoint jwk-set-uri
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/SecurityforSmartcardio/protocol/openid-connect/certs
springdoc.swagger-ui.disable-swagger-default-url=true
spring.security.oauth2.resourceserver.jwt.audiences=